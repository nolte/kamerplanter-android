name: Automerge

on:
  pull_request:
    types:
      - labeled
      - unlabeled
      - synchronize
      - opened
      - edited
      - ready_for_review
      - reopened
      - unlocked
  pull_request_review:
    types:
      - submitted
  check_suite:
    types:
      - completed
  status: {}

# The merging job declares `contents: write` and `pull-requests: write`
# itself; read-only floor here.
permissions:
  contents: read

jobs:
  automerge:
    # An App-token-authored merge triggers downstream workflows
    # (release-drafter); a GITHUB_TOKEN-authored one does not (loop guard).
    # Falls back to GITHUB_TOKEN when `vars.PORTFOLIO_APP_ID` is unset.
    uses: nolte/gh-plumbing/.github/workflows/reusable-automerge.yaml@d51e51ec3ec17ceea09fe9eb40ac00857b6fa1be # v2.0.0
    with:
      app-id: ${{ vars.PORTFOLIO_APP_ID }}
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
      app-private-key: ${{ secrets.PORTFOLIO_APP_PRIVATE_KEY }}
    permissions:
      contents: write
      pull-requests: write
