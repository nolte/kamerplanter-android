name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # This job name is a required status check in .github/settings.yml —
    # rename both together or the merge gate goes stale.
    name: Build, lint & test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/develop' }}

      - name: Set up Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.52.0
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Local↔CI parity (spec/project/taskfile/): CI calls the same targets a
      # contributor runs locally. The assemble step proves the release APK
      # still builds; `build` covers debug + unit tests via lint/test above.
      - name: Lint
        run: task lint

      - name: Unit tests
        run: task test

      - name: Assemble release APK
        run: task assemble

  docs:
    # Like the build job above, this job name is a required status check in
    # .github/settings.yml — rename both together or the merge gate goes stale.
    name: Docs build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Set up Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.52.0
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build docs
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r docs/requirements.txt
          task docs
