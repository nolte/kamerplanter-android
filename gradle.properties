# 6g, not the 2g this started with. CI died with `D8: java.lang.OutOfMemoryError: Java
# heap space` in :feature:plants:mergeExtDexDebugAndroidTest on the first PR run after
# #49's instrumented suite landed (run 33199953762, a markdown-only diff, so the code was
# exactly develop's tip): D8 runs in-process, and four androidTest dex-merges no longer
# fit a 2g daemon. The ubuntu-latest runner has ~16 GB; 6g leaves room for the Kotlin
# daemon beside it.
org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
kotlin.code.style=official
