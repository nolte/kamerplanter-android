version: "3"

# Canonical target vocabulary per spec/project/taskfile/. No remote includes
# from nolte/taskfiles yet, deliberately: the collection's mkdocs include only
# ships `start` (serve, not build) and its pre-commit include resolves against
# a global ~/.venvs/development interpreter, which conflicts with this repo's
# project-local .venv — so the CI-gate targets stay local per that spec.

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  setup:
    desc: One-time onboarding — git hooks and the docs virtualenv
    cmds:
      - pre-commit install
      - python3 -m venv .venv
      - .venv/bin/pip install -r docs/requirements.txt

  lint:
    desc: Static analysis (detekt incl. ktlint rules, Android Lint)
    cmds:
      - ./gradlew detekt lint
      - task: verify:openapi-client

  test:
    desc: JVM unit tests for all modules
    cmds:
      - ./gradlew test
      # buildSrc is a separate build: Gradle compiles it for every invocation but never
      # runs its tests, so without this line the OpenAPI document preparer — the only
      # hand-written transformation in the generation pipeline — ships untested.
      - ./gradlew -p buildSrc test

  check:
    desc: Aggregated quality gate (composition owned by spec/project/quality-gate/)
    cmds:
      - task: lint
      - task: test
      - task: docs

  docs:
    desc: Build the MkDocs site (strict)
    cmds:
      - .venv/bin/mkdocs build --strict

  assemble:
    desc: Build a release APK
    cmds:
      - ./gradlew assembleRelease
      - task: verify:page-size

  verify:page-size:
    desc: Fail if a 64-bit native library is not 16 KB-page aligned (#14)
    cmds:
      # Runs on the assembled artefact rather than on sources: the libraries come from
      # a prebuilt dependency, so only the packaged APK shows what actually ships.
      - python3 scripts/check_page_alignment.py app/build/outputs/apk/release/*.apk

  verify:openapi-client:
    desc: Fail if the vendored OpenAPI schema or the generated client has drifted
    cmds:
      # Two gates from spec/api/openapi-client-integration/:
      #   R-GEN-3 the vendored document still matches the sha256 in its provenance file
      #   R-GEN-7 the checked-in client still matches what that document generates
      # Chained from `lint` rather than declared as its own CI job so the required status
      # check named in .github/settings.yml stays "Build, lint & test".
      - ./gradlew :core:network:verifyOpenApiSchema :core:network:checkApiClientUpToDate
